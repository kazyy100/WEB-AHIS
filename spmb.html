<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pendaftaran SPMB – SMP Al Haudh Islamic School</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --forest: #102F15;
      --sage: #728C5A;
      --lime: #EAF1B1;
      --mint: #EBFADC;
      --ink: #102F15;
      --d: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif;
      --b: 'Figtree', 'Segoe UI', sans-serif;
      box-sizing: border-box;
    }

    *, *::before, *::after {
      box-sizing: inherit;
      margin: 0;
    }

    body {
      font: 400 1rem/1.6 var(--b);
      background: var(--mint);
      color: var(--ink);
      padding-bottom: 60px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    nav {
      position: sticky;
      top: 12px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(760px, 92%);
      margin: 12px auto 32px;
      padding: 8px 12px 8px 20px;
      border-radius: 99px;
      background: rgba(16, 47, 21, .85);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(234, 241, 177, .25);
      color: var(--mint);
    }

    nav b {
      font: 800 1.05rem var(--d);
    }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 99px;
      background: var(--lime);
      color: var(--forest);
      font-weight: 600;
      font-size: .9rem;
    }

    .wrap {
      width: min(900px, 100% - 40px);
      margin-inline: auto;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 32px;
      border: 1px solid rgba(114, 140, 90, .35);
      box-shadow: 0 10px 30px rgba(16, 47, 21, .08);
      margin-bottom: 24px;
    }

    h1 {
      font: 800 clamp(2rem, 6vw, 3.2rem) var(--d);
      color: var(--forest);
      margin-bottom: 8px;
    }

    .promo {
      display: inline-block;
      background: var(--lime);
      color: var(--forest);
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: .9rem;
      margin-bottom: 16px;
    }

    .poster-wrap {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(114, 140, 90, .25);
      text-align: center;
      background: #000;
      margin: 24px 0;
    }

    .poster-wrap img {
      width: 100%;
      max-height: 80vh;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .cta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 99px;
      font-weight: 600;
      text-align: center;
    }

    .cta-btn.wa-ikhwan {
      background: #128C7E;
      color: #fff;
    }

    .cta-btn.wa-akhwat {
      background: #991B1B;
      color: #fff;
    }

    .cta-btn.back {
      background: var(--forest);
      color: var(--mint);
    }
  </style>
</head>

<body>
  <nav>
    <b>SMP Al Haudh</b>
    <a class="btn" href="index.html">&larr; Kembali ke Beranda</a>
  </nav>

  <div class="wrap">
    <div class="card">
      <span class="promo">PROMO GELOMBANG 1 &bull; HEMAT RP 3 JUTA</span>
      <h1>Informasi Pendaftaran SPMB</h1>
      <p style="color: #4d6b3a;">Penerimaan Peserta Didik Baru (SPMB) SMP Al Haudh Islamic School Ciater, Serpong.</p>
      
      <div class="poster-wrap">
        <img src="spmb-poster.jpg" alt="Brosur Resmi SPMB SMP Al Haudh">
      </div>

      <div class="cta-grid">
        <a class="cta-btn wa-ikhwan" href="https://wa.me/6281311303076?text=Bismillah,%20saya%20ingin%20mendaftar%20SPMB%20SMP%20Al%20Haudh%20Ikhwan" target="_blank" rel="noopener noreferrer">
          Daftar WhatsApp Ikhwan: 0813 1130 3076
        </a>
        <a class="cta-btn wa-akhwat" href="https://wa.me/6285693772996?text=Bismillah,%20saya%20ingin%20mendaftar%20SPMB%20SMP%20Al%20Haudh%20Akhwat" target="_blank" rel="noopener noreferrer">
          Daftar WhatsApp Akhwat: 0856 9377 2996
        </a>
      </div>
    </div>
  </div>
</body>

</html>
